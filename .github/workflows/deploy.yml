name: Deploy to Uniweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          mkdir deploy
          cp -R *.html favicon2.png selger.webmanifest site.webmanifest .nojekyll html js media deploy/

      - name: Upload via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          sshpass -p "$SFTP_PASSWORD" sftp \
            -o StrictHostKeyChecking=yes \
            -P "$SFTP_PORT" \
            "$SFTP_USERNAME@$SFTP_HOST" <<EOF
          cd $REMOTE_PATH
          pwd
          lcd deploy
          -mkdir html
          -mkdir js
          -mkdir media
          put *.html
          put favicon2.png
          put selger.webmanifest
          put site.webmanifest
          put .nojekyll
          put -r html
          put -r js
          put -r media
          ls -la
          bye
          EOF
