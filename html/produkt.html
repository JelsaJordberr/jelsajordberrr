<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bildegalleri - Jelsa Jordbær</title>
  <link rel="icon" type="image/png" href="../favicon2.png">
  <link rel="apple-touch-icon" href="../favicon2.png">
  <link rel="manifest" href="../site.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jelsa Jordbær">
  <meta name="theme-color" content="#244c36">
  <link rel="stylesheet" href="style.css?v=20">
</head>
<body data-app-title="Produkter">
    <a class="skip-link" href="#main-content">Hopp til hovedinnhold</a>
    <header>
      <h1>Jelsa Jordbær</h1>
      <p>"Dei får bein å gå på"</p>
  </header>
  <nav id="site-navigation" aria-label="Hovedmeny">
      <ul>
        <li><a href="../index.html">Hjem</a></li>
        <li><a href="omoss.html">Om oss</a></li>
        <li><a href="produkt.html" aria-current="page">Produkter</a></li>
        <li><a href="kontakt.html">Kontakt</a></li>
        <li><a href="oversikt.html">Status</a></li>
      </ul>
  </nav>
  <main id="main-content" class="image-container">
    <div class="product-intro">
      <span class="product-kicker">Utvalet vårt</span>
      <h2>Bær i sesong</h2>
      <p>Bla gjennom bæra me tilbyr gjennom sesongen, både frå eigen gard og frå andre produsentar.</p>
    </div>

    <section class="product-card" aria-label="Produktgalleri">
      <div class="product-image-frame">
        <img id="gallery-image" src="#" alt="">
        <span id="product-count" class="product-count" aria-hidden="true"></span>
      </div>

      <div class="product-details" aria-live="polite">
        <h3 id="product-name"></h3>
        <p id="description"></p>
      </div>

      <div class="product-controls">
        <button id="prev-btn" type="button" aria-label="Vis førre produkt">
          <span aria-hidden="true">←</span> Førre
        </button>
        <div id="product-dots" class="product-dots" aria-hidden="true"></div>
        <button id="next-btn" type="button" aria-label="Vis neste produkt">
          Neste <span aria-hidden="true">→</span>
        </button>
      </div>
    </section>
  </main>
  <script>
    const products = [
      {
        name: 'Moreller',
        image: '../media/moreller.png',
        description: 'Deilige moreller frå Hjelmeland, fulle av smak og friskheit. Morellene kjem frå Johannes Hauge på Randøy.',
        alt: 'Nyskotne moreller frå Hjelmeland'
      },
      {
        name: 'Bringebær',
        image: '../media/bringebeer.png',
        description: 'Søte, fine bringebær som kjem fra Nils Søndenå Stava i Kopervik.',
        alt: 'Ferske bringebær i ei korg'
      },
      {
        name: 'Sonsation',
        image: '../media/sonsationv2.png',
        description: 'Ferske Sonsation-jordbær frå Jelsa, kjende for fast konsistens og god haldbarheit i kjøleskapet.',
        alt: 'Raude Sonsation-jordbær frå Jelsa'
      },
    ];

    let currentIndex = 0;
    const galleryImage = document.getElementById('gallery-image');
    const productName = document.getElementById('product-name');
    const descriptionText = document.getElementById('description');
    const productCount = document.getElementById('product-count');
    const productDots = document.getElementById('product-dots');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const productCard = document.querySelector('.product-card');
    const productDetails = document.querySelector('.product-details');
    let touchStartX = 0;
    let touchStartY = 0;
    let resizeTimer;

    function matchDetailsHeightToLongestText() {
      productDetails.style.minHeight = '';
      if (!window.matchMedia('(max-width: 700px)').matches) return;

      const measurement = productDetails.cloneNode(true);
      const measuredName = measurement.querySelector('#product-name');
      const measuredDescription = measurement.querySelector('#description');
      const detailsWidth = productDetails.getBoundingClientRect().width;

      measurement.removeAttribute('aria-live');
      measurement.style.position = 'fixed';
      measurement.style.left = '-10000px';
      measurement.style.top = '0';
      measurement.style.width = `${detailsWidth}px`;
      measurement.style.height = 'auto';
      measurement.style.minHeight = '0';
      measurement.style.visibility = 'hidden';
      document.body.appendChild(measurement);

      let tallestHeight = 0;
      products.forEach((product) => {
        measuredName.textContent = product.name;
        measuredDescription.textContent = product.description;
        tallestHeight = Math.max(tallestHeight, measurement.scrollHeight);
      });

      measurement.remove();
      productDetails.style.minHeight = `${Math.ceil(tallestHeight)}px`;
    }

    function updateImage() {
      const product = products[currentIndex];
      galleryImage.src = product.image;
      galleryImage.alt = product.alt;
      productName.textContent = product.name;
      descriptionText.textContent = product.description;
      productCount.textContent = `${currentIndex + 1} / ${products.length}`;
      productDots.innerHTML = products
        .map((_, index) => `<span class="${index === currentIndex ? 'active' : ''}"></span>`)
        .join('');
    }

    prevBtn.addEventListener('click', () => {
      currentIndex--;
      if (currentIndex < 0) {
        currentIndex = products.length - 1;
      }
      updateImage();
    });

    nextBtn.addEventListener('click', () => {
      currentIndex++;
      if (currentIndex >= products.length) {
        currentIndex = 0;
      }
      updateImage();
    });

    productCard.addEventListener('touchstart', (event) => {
      touchStartX = event.changedTouches[0].clientX;
      touchStartY = event.changedTouches[0].clientY;
    }, { passive: true });

    productCard.addEventListener('touchend', (event) => {
      const touchEndX = event.changedTouches[0].clientX;
      const touchEndY = event.changedTouches[0].clientY;
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;

      if (Math.abs(deltaX) < 45 || Math.abs(deltaX) < Math.abs(deltaY)) return;

      if (deltaX < 0) {
        nextBtn.click();
      } else {
        prevBtn.click();
      }
    }, { passive: true });

    updateImage();
    matchDetailsHeightToLongestText();

    window.addEventListener('resize', () => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(matchDetailsHeightToLongestText, 120);
    });
  </script>
  <script src="../js/mobile-site.js"></script>
</body>
</html>
